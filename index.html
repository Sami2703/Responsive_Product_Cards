<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive Product Cards</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Laptop">
      <h2>Laptop</h2>
      <p>₹999</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Phone">
      <h2>Phone</h2>
      <p>₹799</p>
      <button>Add to Cart</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/300" alt="Headphones">
      <h2>Headphones</h2>
      <p>₹599</p>
      <button>Add to Cart</button>
    </div>

  </div>

</body>
</html>
